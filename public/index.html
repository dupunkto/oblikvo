<!doctype html>
<html class="soviet">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Oblikvo</title>
    <meta
      name="description"
      content="A browser-based 3D first-person shooter with old school graphics and multiplayer support."
    />

    <!-- We don't have an favicon (yet) -->
    <link rel="icon" href="data:," />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap"
      rel="stylesheet"
    />

    <link href="main.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <time class="timer">xx:xx</time>
    <progress class="health"></progress>
    <div class="chat"></div>
    <div class="crosshair"></div>
    <div class="leaderboard"></div>

    <noscript>
      <h3>JavaScript is required. Sorry!</h3>
    </noscript>

    <main class="loading">
      <h3>Loading...</h3>
    </main>

    <main class="main-menu">
      <h1>Oblikvo</h1>

      <ul>
        <li><a href="javascript:newGame()">New game</a></li>
        <li><a href="javascript:joinGame()">Join game</a></li>
        <li><a href="https://dupunkto.org">Quit</a></li>
      </ul>
    </main>

    <main class="lobby">
      <hgroup>
        <p>Invite Code</p>
        <h1><span class="code">xxxxx</span></h1>
      </hgroup>

      <label>
        <span>Nick</span>
        <input onchange="changeNick(event.target)" type="text" class="nick" />
      </label>

      <small><span class="count">x</span> players in the lobby</small>

      <button class="start" onclick="startGame()">Start</button>
    </main>

    <main class="podium">
      <hgroup>
        <p>MVP</p>
        <h1><span class="mvp">Xx_SUSSY_xX</span></h1>
      </hgroup>

      <p><span class="loser">Xx_BAKA_xX</span> got killed the most</p>

      <button class="again" onclick="playAgain()">Play again</button>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
